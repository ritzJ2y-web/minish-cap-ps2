name: Compilar PS2 ELF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Compilar ELF de PS2
        run: |
          docker run --rm -v "$PWD:/src" -w /src ps2dev/ps2dev:latest sh -c "export PS2DEV=/usr/local/ps2dev; export PS2SDK=\$PS2DEV/ps2sdk; export PATH=\$PATH:\$PS2DEV/bin:\$PS2DEV/ee/bin:\$PS2DEV/iop/bin:\$PS2DEV/dvp/bin:\$PS2SDK/bin; make"

      - name: Disponibilizar ELF para download
        uses: actions/upload-artifact@v4
        with:
          name: MINISH_PS2_ELF
          path: MINISH_PS2.ELF
