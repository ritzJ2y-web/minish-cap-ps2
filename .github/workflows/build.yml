name: Compilar PS2 ELF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Extrair 4 arquivos centrais do port
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo clone 999sian/tmc picori_src -- --depth 1
          echo "=== PORT_MAIN.C ===" > core_port.txt
          cat picori_src/port/port_main.c >> core_port.txt
          echo "=== PORT_BIOS.C ===" >> core_port.txt
          cat picori_src/port/port_bios.c >> core_port.txt
          echo "=== VIRTUAPPU.H ===" >> core_port.txt
          cat picori_src/port/ppu/include/virtuappu.h >> core_port.txt
          echo "=== PORT_PPU.CPP (INICIO) ===" >> core_port.txt
          head -n 250 picori_src/port/port_ppu.cpp >> core_port.txt

      - name: Disponibilizar core_port para download
        uses: actions/upload-artifact@v4
        with:
          name: CORE_PORT
          path: core_port.txt
