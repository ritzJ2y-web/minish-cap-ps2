name: Compilar Minish Cap PS2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Baixar fonte do Project Picori
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo clone 999sian/tmc picori_src -- --depth 1
          mkdir -p picori_src/build/USA/assets ps2_shims/SDL3
          printf "#include <stdint.h>\ntypedef uint32_t Uint32;\ntypedef uint64_t Uint64;\ntypedef void SDL_Window;\ntypedef void SDL_Renderer;\ntypedef void SDL_Surface;\ntypedef void SDL_GPUDevice;\ntypedef int SDL_GPUTextureFormat;\ntypedef int SDL_GPUShaderFormat;\ntypedef int SDL_ScaleMode;\ntypedef struct { Uint32 type; } SDL_Event;\n#define SDL_INIT_VIDEO 1\n#define SDL_INIT_AUDIO 2\n#define SDL_EVENT_QUIT 256\n" > ps2_shims/SDL3/SDL.h

      - name: Compilar ELF Completo de PS2
        run: |
          sed -i 's/^        /\t/g; s/^    /\t/g; s/^  /\t/g' Makefile
          docker run --rm -u root -v "$PWD:/src" -w /src ps2dev/ps2dev:latest sh -c "apk add --no-cache make && make -j4 EE_CFLAGS_EXTRA=-w 2>&1 | tail -n 60; exit \${PIPESTATUS}"

      - name: Disponibilizar ELF para download
        uses: actions/upload-artifact@v4
        with:
          name: MINISH_PS2_ELF
          path: MINISH_PS2.ELF
