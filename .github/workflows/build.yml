name: Compilar PS2 ELF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Baixar fonte do Project Picori e listar estrutura
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo clone 999sian/tmc picori_src -- --depth 1
          echo "=== PASTAS NA RAIZ ==="
          ls -la picori_src
          echo "=== ARQUIVOS DE PLATAFORMA ==="
          find picori_src -maxdepth 3 \( -name "*.c" -o -name "*.h" -o -name "CMakeLists.txt" \) | head -n 60

      - name: Compilar ELF de PS2
        run: |
          sed -i 's/^        /\t/g; s/^    /\t/g; s/^  /\t/g' Makefile
          docker run --rm -u root -v "$PWD:/src" -w /src ps2dev/ps2dev:latest sh -c "apk add --no-cache make && make"

      - name: Disponibilizar ELF para download
        uses: actions/upload-artifact@v4
        with:
          name: MINISH_PS2_ELF
          path: MINISH_PS2.ELF
