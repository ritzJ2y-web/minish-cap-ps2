name: Compilar PS2 ELF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Extrair cabecalhos da pasta port
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo clone 999sian/tmc picori_src -- --depth 1
          echo "=== ESTRUTURA DA PASTA PORT ===" > relatorio_port.txt
          find picori_src/port >> relatorio_port.txt
          echo "=== XMAKE.LUA ===" >> relatorio_port.txt
          cat picori_src/xmake.lua >> relatorio_port.txt
          echo "=== CABECALHOS EM PORT ===" >> relatorio_port.txt
          head -n 200 picori_src/port/*.h picori_src/port/*/*.h >> relatorio_port.txt 2>/dev/null || true

      - name: Disponibilizar relatorio para download
        uses: actions/upload-artifact@v4
        with:
          name: RELATORIO_PORT
          path: relatorio_port.txt
