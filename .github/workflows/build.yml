      - name: Compilar ELF Completo de PS2
        run: |
          sed -i 's/^        /\t/g; s/^    /\t/g; s/^  /\t/g' Makefile
          docker run --rm -u root -v "$PWD:/src" -w /src ps2dev/ps2dev:latest sh -c "apk add --no-cache make && make -j4 CFLAGS_EXTRA=-w 2>&1 | tee build.log; echo '=== ERROS ENCONTRADOS ==='; grep -E 'error:|No such file|undefined reference' build.log | tail -n 30; exit \${PIPESTATUS[0]}"
