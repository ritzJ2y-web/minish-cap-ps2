name: Compilar Minish Cap PS2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Localizar arquivos das variaveis e funcoes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo clone 999sian/tmc picori_src -- --depth 1
          echo "=== ONDE ESTAO AS GLOBAIS ===" > where_files.txt
          grep -rn "gPlayerEntity\b" picori_src/src picori_src/port | head -n 15 >> where_files.txt
          echo "=== ONDE ESTAO BIOS E COLLISION ===" >> where_files.txt
          grep -rn "LZ77UnCompVram\b\|GetActTileAtEntity\b\|Sqrt\b" picori_src/src picori_src/port | head -n 20 >> where_files.txt
          echo "=== ONDE ESTAO BGM E SCRIPTS ===" >> where_files.txt
          grep -rn "bgmTitleScreen\b\|script_BombMinish\b\|Entities_HouseInteriors1_Mayor_080D6210\b" picori_src/src picori_src/port picori_src/sound | head -n 20 >> where_files.txt
          echo "=== XMAKE.LUA COMPLETO ===" >> where_files.txt
          cat picori_src/xmake.lua >> where_files.txt

      - name: Disponibilizar relatorio
        uses: actions/upload-artifact@v4
        with:
          name: WHERE_FILES
          path: where_files.txt
